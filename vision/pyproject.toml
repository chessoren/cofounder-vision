[project]
name = "cofounder-vision"
version = "0.1.0"
description = "OpenCV 5 perception library for Cofounder: locate UI elements, verify screen changes, segment screen recordings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless==5.0.0.93",
    "numpy==2.2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cofounder_vision"]

[dependency-groups]
dev = ["pytest"]
